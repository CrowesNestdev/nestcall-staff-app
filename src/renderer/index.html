<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'">
<title>Nest Call</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.45 "Segoe UI",system-ui,sans-serif;background:#000;color:#f4f4f5}
  #bg-canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;background:#000}
  #root{position:relative;z-index:1}
  .wrap{max-width:680px;margin:0 auto;padding:20px 20px 40px}
  header.top{display:flex;align-items:center;gap:12px;margin-bottom:16px}
  header.top{color:#fff}
  .mark{display:flex;align-items:center;gap:10px;flex:1}
  .mark img{width:34px;height:34px;display:block}
  .mk-t{letter-spacing:.32em;font-size:15px;font-weight:700;text-transform:uppercase}
  .mk-t i{font-style:normal;font-weight:400}
  .pill{padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600}
  .pill.ok{background:#dcfce7;color:#166534}.pill.bad{background:#fee2e2;color:#991b1b}
  .card{color:#111827;background:#fff;border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
  .card h2{font-size:15px;margin:0 0 10px}
  .muted{color:#a1a1aa;font-size:13px}
  .card .muted{color:#6b7280}
  .wrap>.card h2,.wrap>.card p{color:inherit}
  input[type=email],input[type=password]{width:100%;padding:10px 12px;border:1px solid #d1d5db;border-radius:8px;font:inherit;margin:4px 0 12px}
  button{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid #d1d5db;background:#fff;cursor:pointer}
  button.primary{background:#0b0b0c;border-color:#0b0b0c;color:#fff;font-weight:600}
  button:disabled{opacity:.6;cursor:default}
  .login{max-width:380px;margin:50px auto}
  .login .card{background:rgba(28,28,28,.84);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.16);border-radius:18px;padding:26px;color:#fff;box-shadow:0 24px 70px rgba(0,0,0,.65)}
  .login .card .muted{color:#a1a1aa}
  .login .card label{font-weight:600;font-size:13px}
  .login .card input{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.22);color:#fff}
  .login .card input::placeholder{color:#a1a1aa}
  .login .card input:-webkit-autofill{-webkit-text-fill-color:#fff;box-shadow:0 0 0 100px #3f3f46 inset}
  .login .card button.primary{background:#000;border-color:rgba(255,255,255,.2)}
  .login .card button{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.22);color:#fff}
  .login>.muted{margin:0 0 20px}
  .brand-big{display:flex;flex-direction:column;align-items:center;gap:12px;margin-bottom:10px}
  .brand-big img{display:block}
  .brand-big .brand-full{width:92px;height:auto}
  .wm{display:flex;flex-direction:column;align-items:center;line-height:1;color:#fff;text-transform:uppercase}
  .wm .a{font-weight:700;font-size:21px;letter-spacing:.5em;margin-right:-.5em}
  .wm .b{font-weight:400;font-size:10px;letter-spacing:.62em;margin-right:-.62em;margin-top:6px}
  .err{background:#fee2e2;color:#991b1b;border-radius:8px;padding:8px 10px;margin:0 0 12px}
  .banner{background:#fee2e2;color:#991b1b;border-radius:10px;padding:10px 14px;margin-bottom:14px;font-weight:600}
  table{width:100%;border-collapse:collapse}
  td{padding:8px 4px;border-top:1px solid #f0f1f3;vertical-align:middle}
  tr:first-child td{border-top:0}
  .tag{font-size:12px;padding:2px 8px;border-radius:6px;background:#dcfce7;color:#166534}
  .tag.off{background:#fee2e2;color:#991b1b}
  .row{display:flex;align-items:center;gap:10px;margin:8px 0}
  .row label{flex:1}
  select{font:inherit;padding:6px 8px;border-radius:8px;border:1px solid #d1d5db;background:#fff}
  .site{display:flex;gap:10px;align-items:center;padding:8px 0}
  .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
</style>
</head>
<body>
<div class="wrap" id="root"></div>
<script src="bg.js"></script>
<script src="index.js"></script>
</body>
</html>
